name: CI - Build, Push, Update GitOps

on:
  push:
    branches: [aws-migration]
    tags: ["v*.*.*"]
  pull_request:
    branches: [aws-migration]
  workflow_dispatch:
    inputs:
      reason:
        description: "재빌드 사유"
        required: false
        default: "Manual rebuild for updated env variables"

concurrency:
  group: poo-diary-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GITOPS_REPOSITORY: uhjinkim9/helm-chart
  GITOPS_BRANCH: aws-migration
  CHART_PATH: charts/poo-diary

jobs:
  build-and-push:
    name: Build & Push API/Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API image metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/poo-diary-api
          tags: |
            type=raw,value=build-${{ github.run_number }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/aws-migration' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Extract Web image metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/poo-diary-web
          tags: |
            type=raw,value=build-${{ github.run_number }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/aws-migration' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            INTERNAL_API_URL=${{ vars.INTERNAL_API_URL || 'http://poo-diary-api:3001' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  update-gitops:
    name: Update Helm image tags
    # PR은 이미지 검증만 한다. aws-migration Push 또는 해당 브랜치에서 수동
    # 실행한 경우에만 이미지를 Push한 뒤 AWS GitOps 브랜치의 태그를 바꾼다.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/aws-migration'
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          fetch-depth: 1

      - name: Update API and Web tags
        env:
          IMAGE_TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          VALUES_FILE="${CHART_PATH}/values.yaml"

          test -f "${VALUES_FILE}"
          test "$(yq -r '.api.image.repository' "${VALUES_FILE}")" = "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/poo-diary-api"
          test "$(yq -r '.web.image.repository' "${VALUES_FILE}")" = "${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/poo-diary-web"
          yq -i '.api.image.tag = strenv(IMAGE_TAG)' "${VALUES_FILE}"
          yq -i '.web.image.tag = strenv(IMAGE_TAG)' "${VALUES_FILE}"

          test "$(yq '.api.image.tag' "${VALUES_FILE}")" = "${IMAGE_TAG}"
          test "$(yq '.web.image.tag' "${VALUES_FILE}")" = "${IMAGE_TAG}"

          echo "API/Web image tag: ${IMAGE_TAG}"

      - name: Commit and push Helm values
        env:
          IMAGE_TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          VALUES_FILE="${CHART_PATH}/values.yaml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${VALUES_FILE}"

          if git diff --cached --quiet; then
            echo "이미 최신 태그입니다."
            exit 0
          fi

          git commit -m "ci: deploy poo-diary ${IMAGE_TAG} [skip ci]"
          # 원격 브랜치가 앞서 있으면 non-fast-forward로 실패한다. 강제 Push는
          # 하지 않으므로 GitOps 저장소의 다른 변경을 덮어쓰지 않는다.
          git push origin "HEAD:${GITOPS_BRANCH}"

  notify:
    name: Discord notification
    if: always() && github.event_name != 'pull_request'
    needs: [build-and-push, update-gitops]
    runs-on: ubuntu-latest

    steps:
      - name: Notify success
        if: needs.build-and-push.result == 'success' && needs.update-gitops.result == 'success'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "✅ 이미지 Push 및 GitOps 업데이트 완료: poo-diary"
          description: |
            **태그:** `build-${{ github.run_number }}`
            **커밋:** `${{ github.sha }}`
            **GitOps:** `${{ env.GITOPS_BRANCH }}` / `${{ env.CHART_PATH }}`
            Argo CD 자동 동기화 대상이 갱신되었습니다. Kubernetes 배포 완료 여부는 Argo CD에서 확인해 주세요.
          color: 0x57F287

      - name: Notify failure
        if: needs.build-and-push.result == 'failure' || needs.update-gitops.result == 'failure'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "❌ 빌드 실패: poo-diary"
          description: |
            **로그:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          color: 0xED4245

      - name: Notify image-only completion
        if: needs.build-and-push.result == 'success' && needs.update-gitops.result == 'skipped'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: warning
          title: "ℹ️ 이미지 Push 완료 · GitOps 업데이트 미수행: poo-diary"
          description: |
            **태그:** `build-${{ github.run_number }}`
            버전 태그 Push 또는 aws-migration 이외 ref의 수동 실행입니다.
            GitOps 태그는 aws-migration Push 또는 aws-migration에서 실행한 workflow_dispatch에서만 변경되므로 Argo CD 배포가 시작되지 않았습니다.
          color: 0xFEE75C

      - name: Notify cancelled
        if: needs.build-and-push.result == 'cancelled' || needs.update-gitops.result == 'cancelled'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: warning
          title: "⚠️ CI/CD 취소됨: poo-diary"
          description: |
            **로그:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            이미지 Push 또는 GitOps 업데이트가 완료되지 않았을 수 있습니다.
          color: 0xFEE75C
